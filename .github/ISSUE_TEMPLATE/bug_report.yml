name: Bug report
description: Report something that does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — email `opensource@mxent.com`.

  - type: input
    id: pwax-version
    attributes:
      label: Pwax version
      placeholder: 2.0.0
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: 13.2.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.3.14
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behaviour and the actual behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal component or route that demonstrates the problem.
      render: php
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      render: shell
