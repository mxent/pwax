name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        include:
          - php: '8.3'
            laravel: '12.*'
            stability: prefer-lowest
        exclude:
          # Laravel 13 requires PHP 8.3 or higher.
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Constrain Laravel version
        run: |
          composer require --dev --no-interaction --no-update \
            "orchestra/testbench:${{ matrix.laravel == '13.*' && '^11.0' || '^10.0' }}"
          composer require --no-interaction --no-update \
            "illuminate/support:${{ matrix.laravel }}"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Show installed versions
        run: composer show --direct

      - name: Run tests
        run: vendor/bin/phpunit

  js:
    runs-on: ubuntu-latest
    name: Client runtime

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type definitions
        run: npm run types

      - name: Unit tests
        run: npm test

      - name: Verify the committed bundle matches source
        run: |
          npm run build
          git diff --exit-code -- dist/ \
            || (echo "::error::dist/ is out of date. Run 'npm run build' and commit the result." && exit 1)
