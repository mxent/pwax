name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    runs-on: ubuntu-latest
    name: Code Style
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - name: Laravel Pint
        run: vendor/bin/pint --test

  phpstan:
    runs-on: ubuntu-latest
    name: Static Analysis
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  audit:
    runs-on: ubuntu-latest
    name: Dependency Audit
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - name: composer audit
        run: composer audit --abandoned=report
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Every npm dependency here is development-only — the Composer package ships the
      # prebuilt dist/pwax.js and nothing from node_modules. They are still audited
      # because contributors run the Vitest and Vite dev servers locally, which is
      # exactly what this toolchain's advisories tend to concern.
      - name: npm audit
        run: npm audit --audit-level=high
